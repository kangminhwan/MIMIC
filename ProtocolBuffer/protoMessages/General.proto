enum TableAction
{
	TableAction_None = 0;	// 테이블 액션 없음													

	TableAction_Call = 101;	// 이전 참여 금액을 맞추는 액션										// 콜 : 앞사람의 베팅 금액과 동일한 금액 베팅 (CALL)
	TableAction_SeedOnly = 102;	// 기본 판돈만 참여하는 액션									// 삥 : 시드금액(기본판돈)만 베팅 (보스만 가능), 교환 간 1회만 가능함
	TableAction_DoubleRaise = 103;	// 이전 참여 금액의 두 배 액션								// 따당 : 앞 사람이 베팅한 금액의 2배를 베팅함 (CALL*2)
	TableAction_HalfPot = 104;	// 전체 판돈의 50퍼센트 기준 액션								// 하프 : 전체 판돈의 50%를 베팅, (POT+CALL)*1/2+CALL
	TableAction_GiveUp = 105;	// 진행 포기 액션													// 다이 : 해당 게임을 포기함
	TableAction_Check = 106;	// 금액 추가 없이 순서를 넘기는 액션								// 체크 : 베팅하지 않고, 다음 플레이어 베팅 순으로 넘김(0)
	TableAction_QuarterPot = 107;	// 전체 판돈의 25퍼센트 기준 액션								// 전체 판돈의 25%를 베팅, (POT+CALL)*(1/4)+CALL
	TableAction_Maximum = 108;	// 허용 범위 내 최대 액션									    // 맥스 : 플레이어의 베팅 한도 내 최대 베팅

	TableAction_SmallBlind = 201;	// 홀덤 스몰 블라인드 액션									// 홀덤 : SB
	TableAction_BigBlind = 202;	// 홀덤 빅 블라인드 액션										// 홀덤 : BB
	TableAction_FullPot = 203;	// 전체 판돈 기준 액션											// 전체 판돈의 100%를 베팅, (POT+CALL) +CALL
	TableAction_AllIn = 204;	// 보유 금액 전체 참여 액션											// 올인 : 가진 돈의 전부를 베팅

	TableAction_TableMaxStake = 301;	// 채널 최대 베팅 액션										// 채널에 설정된 Max Bet
	TableAction_TableStakeA = 302;	// 테이블 기준 베팅 A										// 베팅 금액은 채널 마다 다름
	TableAction_TableStakeB = 303;	// 테이블 기준 베팅 B										// 베팅 금액은 채널 마다 다름
	TableAction_TableStakeC = 304;	// 테이블 기준 베팅 C										// 베팅 금액은 채널 마다 다름
	TableAction_TableStakeD = 305;	// 테이블 기준 베팅 D										// 베팅 금액은 채널 마다 다름

	TableAction_PairPlus = 401;	// 페어 플러스 액션												//PP 
}																								

