////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

message RoomNumberQuery
{
	uint64 member_id = 1;
}

message PickGridChoice
{
	uint32 pick_kind = 3;
	uint32 column_index = 2;
	uint32 row_index = 4;
	bool chosen = 1;
}

message GridCellGroup
{
	repeated GridCell grid_cells = 1;					// 콤보 처리시에 삭제될 데이터의 row, column 정보 데이터 순서 ( row 0 column 0 , row 1 column 0 , row 0 column 1 , row 1 column 1 ) 의 순서로 보내준다.
}

message PeakRecordSummary
{
	uint64 lifetime_coin_peak = 3;		// 통산 최고 코인
	uint64 lifetime_chip_peak = 1;	// 통산 최고 칩
	uint64 daily_coin_peak = 4;		// 금일 최고 코인
	uint64 daily_chip_peak = 2;	// 금일 최고 칩
}

message LoungeBenefitEvent
{
	int32 coin_recovery_count = 5;					// 보유코인 한도 초과시 초과 코인 복구 횟수
	string ends_at = 3;							// 종료 날짜 ( YYYY-MM-DD HH:mm:ss )
	string starts_at = 4;							// 시작 날짜 ( YYYY-MM-DD HH:mm:ss )
	int32 rakeback_ratio = 6;						// 적립통장 적립율 ( 65 인 경우 0.65 )
	int32 dealer_fee_discount_rate = 2;					// 딜러비 할인율 ( 50 인 경우 50% )
	uint64 coin_balance_limit = 1;						// 보유 코인 + 금고 코인
}

message SlotDebugResult
{
}

message SpinLayout
{
	repeated ReelWindow reel_windows = 2;		// 릴데이터 목록 
	int32 column_total = 1;					// 열갯수 vertical
	int32 row_total = 3;					// 행갯수 horizontal
}

message MysteryReelOutcome
{
	LineHitInfo mystery_line_hits = 2;
	ReelWindow mystery_reel_window = 1;
}

message EpicWinTickerEntry
{
	uint64 ticker_score = 3;
	SlotCatalog slot_catalog = 1;
	string display_name = 2;
}

message ReelWindow
{
	repeated ReelSymbol reel_symbols = 1;		// 심볼 전체 목록 ( 행 * 열 갯수 ) row, column 기반의 심볼 목록 데이터 순서 ( row 0 column 0 , row 1 column 0 , row 0 column 1 , row 1 column 1 ) 의 순서로 보내준다.
}

message WinningHandHistory
{
	int32 winning_card_sum = 2;				// 바카라 승리한 경우의 카드 넘버 합산
	repeated HandRank baccarat_hand_ranks = 5;		// 바카라 전용 족보
	int32 play_order = 1;				// 플레이 순서, 내림 차순
	bool give_up_win = 4;						// 기권 여부 ( 출력 : 기권승 )
	HandRank hand_rank = 3;						// 족보
}

message BaccaratHandStakeMap
{
	map<int32, uint64> hand_rank_stakes = 9;			// 바카라 족보별 베팅 금액, Key 를 HandRank 로 변환해서 사용할것
}

message SlotDebugCommand
{
	bool clear_debug_values = 3;
	uint64 reel_set_no = 1;
	repeated uint64 reel_indices = 5;
	SpinMode spin_mode = 2;
	SlotCatalog slot_catalog = 6;
	uint64 member_id = 4;
}

message RoomSnapshot
{
	repeated string history_notes = 24; // 최근 승리 족보, 고민중
	string channel_code = 6;				// 채널 아이디
	int32 play_phase = 41;						// 게임스텝 (server-internal PlayPhase 값, Server.proto 참고)
	int32 room_no = 14;						// 방번호
	repeated int32 cold_numbers = 33;				// 콜드번호
	repeated int32 hot_numbers = 9	;				// 핫번호
	repeated int32 hit_numbers = 37;				// 최근 당첨번호 : 20개
	repeated WinningHandHistory winning_history = 21;			// 최근 승리 족보
	uint64 recent_avg_pot_amount = 2;				// 최근 게임 정보 : 평균 팟 금액, 최근 5 경기
	uint64 recent_largest_pot = 35;					// 최근 게임 정보 : 최대 팟 금액, 최근 5 경기
	uint64 largest_pot = 20;						// 통산 게임 정보 : 최대 팟 금액
	uint32 played_rounds = 40;				// 통산 게임 정보 : 총 게임 수
	uint64 tie_pair_limit = 32;				// 타이 페어 맥스
	uint64 player_banker_limit = 4;			// 플레이어 뱅커 맥스
	uint64 pair_plus_limit =11;						// 방에서 배팅 할 수 있는 최대 pp값
	uint64 wager_limit = 39;				// 방에서 베팅 할 수 있는 최대 값
	uint64 previous_wager = 7;					// 로우바둑이 직전 유저 베팅 금액
	uint64 pot_amount = 30;						// 로우바둑이 이번판 누적금액
	int32 last_bet_seat = 25;		// 현재 베팅 순서중 라스트 슬롯, 1 ~ 5, 서버에서만 필요
	int32 active_bet_seat = 8;			// 현재 베팅 진행 슬롯, 1 ~ 5, 서버에서만 필요
	int32 leader_seat = 36;					// 현재 players 상에서의 boss 슬롯번호, 1 ~ 5
	int32 host_seat = 1;					// 현재 players 상에서의 master ( 방장 ) 슬롯번호, 1 ~ 5
	RoomState room_state = 23;			// RoomState_InPlay 이면 참여 불가능, 관전만 가능
	uint64 seed_amount = 34;			// SeedMoney Value 값
	AssetKind asset_kind = 13;				// Money 타입
	repeated ParticipantProfile participants = 22;			// 
	int32 seat_limit = 12;			// 플레이 참여 허용 인원
	RuleProfile rule_profile = 38;		// 일반, 블라인드
	BetPolicy bet_policy = 31;	// 하프, 풀
	RoomAccessMode access_mode = 5;					// 룸 타입 ( 칩, 코인, 친구 초대)
	PlayCategory play_category = 10;					// 게임 타입 ( 로우바둑이 ...)
	uint64 session_seed = 3;
	int32 priority_tier = 15;
	int32 client_rev = 16;
	int32 shard_hint = 17;
	string audit_tag = 18;
	int32 rollout_stage = 19;						// 단계적 배포용
	int32 schema_rev = 26;						// 스키마 리비전
	string client_locale = 27;						// 클라 로케일
}

message LineHitInfo
{
	repeated GridCellGroup full_hit_lines = 3;				// 히트된 라인의 심복 리스트 전체
	repeated uint64 hit_reward_amounts = 2;						// 히트된 라인별 획득 재화
	repeated int32 hit_line_numbers = 1;							// 히트된 라인 목록
	repeated GridCellGroup hit_groups = 4;						// 히트된 라인의 심복 리스트 히트된 심볼 목록만
}

message PickSpinOption
{
	int32 multiplier_choice = 2;
	int32 spin_count_choice = 1;
}

message LossLimitProfile
{
	uint64 created_at = 9;						// LossLimitProfile 생성 시간 ( 서버간 동기화에 사용 )
	int32 pending_play_block_hours = 11;					// 다음 제한 시간 설정
	int32 play_block_hours = 12;						// 제한 시간 설정 ( 손실한도에 도달한 경우 설정한 시간 동안 게임 참가 불가 , default 6시간)
	uint64 account_id = 10;							// account_idx ( user_account 테이블 )
	string purchase_limit_reset_at = 6;			// 구매 제한 갱신 시간 ( 매월 1일 0시 기준 초기화 )
	uint64 monthly_purchase_total = 1;					// 이번달 총 구매 금액
	uint64 purchase_limit_amount = 7;							// 구매 제한 금액
	string loss_limit_reset_at = 5;			// 손실한도 갱신 시간 ( 제한 기준값이 걸려 있는 상태에서는 0시에 초기화를 처리 하면 안된다. )
	int64 daily_chip_loss = 2;					// 오늘 총 손실 칩
	int32 loss_limit_changes = 3;				// 손실한도 변경 횟수 ( 매월 2회 변경 가능, 매월 1일 0시 기준 초기화 )
	uint64 pending_loss_limit = 4;						// 다음 손실한도 셋팅 금액 ( 0 이면 처리 안함 )
	uint64 loss_limit_amount = 8;							// 손실한도 설정 금액
	// 서버사용
	uint64 session_seed = 13;
	int64 sync_epoch = 14;						// 동기화 기준 시각
}

message RoomListEntry
{
	int32 server_node_id = 21;					// 서버 아이디
	repeated int32 cold_numbers = 20;				// 콜드번호
	repeated int32 hot_numbers = 13;				// 핫번호(룰렛용)
