syntax = "proto3";

import "General.proto";

package PmNet;

message BCHailFinalWagerRQ
{
	int32 _crc = 1;									// checksum
	bytes ctx_buf = 11;								// client data buffer
	bytes _reserved12 = 12;
}

message BCHailFinalWagerRS
{
	General.AssetKind fund_kind = 1;
	uint64 fund_after = 2;
	uint64 wager_member_idx = 4;					// bet player idx
	uint64 fund_before = 5;
	uint64 pp_wager = 6;							// pp_bet
	bytes ctx_buf = 11;								// client data buffer
	map<int32, uint64> bc_wagers = 12;				// baccarat bet amount per hand rank (convert Key to General.HandRank)
	int32 _crc = 16;								// checksum
	int32 _reserved17 = 17;
}



message FlankWagerRS
{
	bool flank_flag = 1;
	uint64 member_idx = 4;					// player idx
	int32 _crc = 5;							// checksum
}

// bet order, card change process message
message PhaseTurnRS
{
	int32 remain_ms = 1;							// remaining time (ms). whether to notify once or per second TBD; server adds ~2s buffer.
	int32 split_no = 2;								// blackjack 0~4 (main dealing is 0; splits only proceed 1~4)
	uint64 member_wager = 3;						// user bet size
	uint64 member_idx = 4;							// user to bet or change cards
	int32 match_phase = 5;				// play phase, FirstBet, SecondBet, ThirdBet, FinalBet (server PlayPhase value)
	uint64 max_wager = 6;							// highest bet size
	repeated General.TableAction wager_options = 7;	// available bet list
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
}

message MemberDropAuxKeyRQ
{
	string cur_aux_key = 4;							// sub password
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
}

message MemberDropAuxKeyRS
{
	int32 aux_key_miss_cnt = 4;						// password retry fail count
	bytes ctx_buf = 11;								// client data buffer
}

message RevealRS
{
	repeated General.PlayingCard shared_cards = 1;			// full community card list
	repeated uint64 flank_member_idx_list = 2;		// send list of side-bet players to client.
	repeated General.PlayingCard fresh_shared_cards = 4;	// newly received community cards
	map<uint64, General.CardSet> member_hand_tiles = 5;// player hand card list
	int32 _crc = 7;									// checksum
}

message RabbitHuntRQ
{
														// holdem rabbit hunt request. no body needed, requester identified by session.
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;									// checksum
}

message RabbitHuntRS
{
	repeated General.PlayingCard rabbit_cards = 1;		// cosmetic reveal of the board cards that would have come out, doesn't affect the payout
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;									// checksum
}

message ShowHandRQ
{
	General.HandRevealScope reveal_scope = 1;			// which hole card(s) to reveal (left / right / all)
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;									// checksum
}

message ShowHandRS
{
	uint64 member_idx = 1;								// player who revealed
	repeated General.PlayingCard hand_tiles = 2;		// revealed hole card(s), count depends on reveal_scope
	General.HandRevealScope reveal_scope = 3;			// which hole card(s) were revealed
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;									// checksum
}




message MatchWagerRQ
{
	General.HandRank bc_wager_hand_rank = 1;				// baccarat bet position
	uint64 aux_member_idx = 2;						// blackjack sub player PlayerIdx
	General.TableAction wager_kind = 4;				// bet
	int32 aux_member_seat = 5;						// blackjack sub player bet slot number (1~5)
	bool pp_wager_flag = 6;							// blackjack pp-bet flag?
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
	int32 _reserved16 = 16;
}

message MatchWagerRS
{
	General.TableAction member_wager = 1;			// bet
	uint64 fund_before = 2;
	bool all_in_flag = 3;							// all-in occurrence state
	uint64 wager_member_idx = 4;					// bet player idx
	General.AssetKind fund_kind = 5;
	uint64 fund_after = 6;
	bool flank_flag = 7;							// side-bet occurrence state (true if any side bet with even 1 chip)
	General.HandRank bc_wager_hand_rank = 8;				// baccarat bet position
	bytes ctx_buf = 11;								// client data buffer
	map<int32, uint64> bc_wagers = 12;				// baccarat bet amount per hand rank (convert Key to General.HandRank)
	bool pp_wager_flag = 13;						// blackjack pp-bet flag?
	uint64 export_batch_id = 9;
	uint32 feature_mask = 10;						// 기능 플래그 비트마스크
}

message NativeKeySwapRQ
{
	string enc_ts = 1;						// identity NICE API processing time
	string native_id = 2;					// account id to create (5-12 chars alphanumeric)
	string ci = 4;							// identity NICE API ci
	string native_key = 5;					// password (ASE 128 encrypted storage)
	bytes ctx_buf = 11;						// client data buffer
	int32 _crc = 15;						// checksum
}

message NativeKeySwapRS
{
	bytes ctx_buf = 11;		// client data buffer
}

message InboxReadRQ
{
	repeated uint64 inbox_idx_list = 4;				// inbox idx list to open
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
	string _reserved16 = 16;
}

message InboxReadRS
{
	uint64 stacks = 1;								// earned chip
	repeated General.AvatarProfile skin_list = 2;			// acquired avatar list
	repeated uint64 fail_idx_list = 3;				// failed to acquire inbox list
	repeated uint64 inbox_idx_list = 4;				// opened inbox idx list
	uint64 tokens = 5;								// earned coin
	repeated int32 item_nos = 6;					// acquired item list
	uint64 gems = 7;								// free gem
	uint64 paid_gems = 8;							// paid gem
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
	bytes _reserved16 = 16;
}

// vote execute request
message ChamberPollAttemptRQ
{
	uint64 poll_target_idx = 1;						// vote target idx
	uint64 poll_requester_idx = 4;					// vote requester idx
	General.BallotKind poll_kind = 5;					// ballot kind (currently Kick only)
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
	int32 _reserved16 = 16;
}

// vote execute response (to all users in room)
message ChamberPollAttemptRS
{
	uint64 poll_target_idx = 1;						// vote target idx
	int32 poll_idx = 2;								// vote idx (valid in current room only); must be set on RoomVoteAnswer.
	uint64 poll_requester_idx = 4;					// vote requester idx
	General.BallotKind poll_kind = 5;					// ballot kind (currently Kick only)
	int32 poll_remain_sec = 6;						// vote process time (must approve/reject within server-allotted time)
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
	int32 _reserved16 = 16;
}

// refresh recent win data
message ChamberLogRefreshRS
{
	repeated General.WinningHandHistory win_log = 4;			// recent winning hand rank
	int32 _crc = 9;									// checksum
}

message PushStickerRQ
{
	uint64 member_idx = 1;
	int32 sticker_id = 4;							// emoticon id
	bytes ctx_buf = 11;								// client data buffer
}

message PushStickerRS
{
	uint64 member_idx = 1;
	int32 sticker_id = 4;							// emoticon id
	bytes ctx_buf = 11;								// client data buffer
}

message SharedTileRS
{
	repeated General.PlayingCard shared_cards = 1;			// full community card list
	int32 match_phase = 2;				// play phase (server PlayPhase value)
	repeated General.PlayingCard fresh_shared_cards = 4;	// newly received community cards
	bool intrusion_flag = 5;						// activation flag on intrusion
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
}

message MateChamberBuildRQ
{
	General.BetPolicy wager_rule = 1;			// BettingRuleType (half-bet, full-bet)
	string ch_token = 4;							// Channel ID (refer to channel list data file)
	bytes ctx_buf = 11;								// client data buffer
}

message MateChamberBuildRS
{
	General.RoomSnapshot chamber_info = 1;				// room info
	uint64 lead_idx = 2;							// boss idx
	string ch_token = 3;							// Channel ID (refer to channel list data file)
	int32 chamber_no = 4;							// room number
	repeated General.ParticipantProfile members = 5;				// active user data
	uint64 captain_idx = 6;							// room host idx
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
}

message InformObserverCntRS
{
	int32 observer_cnt = 4;							// watcher count
}

enum BJSideOutcomeKind
{
	BJSideOutcomeKind_None = 0;
	Mix = 1;
	Color = 2;
	Perfect = 3;
}

message ResumeSigninRS
{
	General.ParticipantProfile member_info = 1;			// player data
	General.LossLimitProfile loss_cap = 2;			// loss limit
	Ledger ledger = 3;						// records (LB baduki, holdem, baccarat, blackjack, slot)
	string svr_ts = 4;						// server time. if sync needed, set client time to server time.
	repeated General.AvatarProfile skins = 5;		// player avatar list
	int32 aux_key_miss_cnt = 6;				// sub password retry count
	bool first_signin = 7;					// player first login flag (true: attendance activation required, check inbox rewards)
	int32 key_miss_cnt = 8;					// password retry count
	// records related -> deciding whether to split packet or include in login response
	repeated General.PeakRecordSummary top_log_list = 9;	// all-time record list
	bytes ctx_buf = 10;						// client data buffer
	string quit_planned_ts = 11;			// scheduled withdrawal date (can cancel before expiry)
	string profile_uid = 12;				// account UID
	// red dot handling
	bool inbox_pending = 13;				// inbox alert
	string block_begin = 14;				// sanction start time
	string block_end = 15;					// sanction end time
	string block_cause = 16;				// sanction reason
	General.LoungeBenefitEvent atrium_drop = 17;	// lounge event (check active state within start/end date)
	string outlet_uid = 18;					// outlet UID
	bool tier_stale = 19;					// membership expired
	ChamberEnterRS chamber_enter_res = 20;	// room info
	ShiftAtriumRS shift_atrium_res = 21;		// server change
	int32 _v = 30;							// spec ver
	uint32 feature_mask = 22;						// 기능 플래그 비트마스크
	int32 priority_tier = 23;
	int32 rollout_stage = 24;						// 단계적 배포용
	int32 retry_count = 25;
	int32 shard_hint = 26;
	int32 build_channel = 27;
	int32 _reserved31 = 31;
}

message ExpelMemberRQ
{
	uint64 expel_member_idx = 1;					// force-kicked user's player_idx
	int32 chamber_no = 4;							// room number
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
	bytes _reserved16 = 16;
}

message ExpelMemberRS
{
	string expel_cooldown = 1;						// kick cooldown
	uint64 expel_member_idx = 4;					// force-kicked user's player_idx
	string expel_alias = 5;							// kicked user's nickname
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
	int32 _reserved16 = 16;
}

// process start message, host-only execution
message MatchKickoffRQ
{
	int32 _crc = 1;									// checksum
	bytes ctx_buf = 11;								// client data buffer
}

message MatchKickoffRS
{
	int32 _crc = 1;									// checksum
	bytes ctx_buf = 11;								// client data buffer
	bytes _reserved12 = 12;
}

// market purchase
message MarketPurchaseRQ
{
	string item_no = 1;								// shop id
	string recv_proof = 2;							// payment receipt
	bool sandbox_flag = 3;							//sandbox flag
	General.StoreProductKind market_item_kind = 4;	// General.StoreProductKind
	string dev_payload = 5;							// may be used later (server-issued payment validation string)
	string sig = 6;
	bytes ctx_buf = 11;								// client data buffer
	int32 _crc = 15;								// checksum
}

message MarketPurchaseRS
{
	General.ParticipantProfile refresh_member = 1;				// player refresh
	bool inbox_got = 4;								// inbox received flag (true if inbox list request required)
	repeated General.AvatarProfile refresh_skins = 5;		// avatar refresh
	bytes ctx_buf = 11;								// client data buffer
	string bill_fail = 12;							//billing error on purchase fail
	string txn_id = 13;								// used only when Market Code is Apple. (usage TBD)
	int32 _crc = 17;								// checksum
	int32 _reserved18 = 18;
}

message ReelMegaWinBoard
{
	bool in_match_flag = 1;
	repeated General.EpicWinTickerEntry epicwin_list = 4;
	int32 _crc = 5;						// checksum
}

// baccarat Pair, Natural notification
message BCCoupleNtlRS
{
	bool member_ntl = 1;							// player Natural
	bool banker_ntl = 2;							// banker Natural
	bool member_pair = 4;							// player Pair
	bool banker_pair = 5;							// banker Pair
	int32 _crc = 6;									// checksum
}


message OutcomeCompleteRQ
{
														// result screen end packet (holdem, baduki). no server response
	int32 _crc = 1;									// checksum
	int32 _reserved2 = 2;
}



