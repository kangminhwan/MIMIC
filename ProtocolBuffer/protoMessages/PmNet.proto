	uint64 cover_payout = 14;						// when insurance bet against dealer blackjack (bet amount + reward amount = total; insurance 50K becomes 100K)
	uint64 equal_payout = 15;						// when even money bet against dealer blackjack (receive reward equal to bet amount)
