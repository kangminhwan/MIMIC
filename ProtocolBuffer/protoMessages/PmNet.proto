{
	BJOutcomeKind_None = 0;
	Win = 1;
	Lose = 2;
	Draw = 3;
	EvenMoney = 4;									// processing for even money bet; not win/loss/draw.
}

message ShiftAtriumRS
{
	int32 endpoint = 1;						// target lobby server port
	string profile_uid = 2;					// account UID
	string atrium_node_ip = 4;				// target lobby server IP
	string outlet_uid = 5;					// outlet UID
	int32 _crc = 9;							// checksum
