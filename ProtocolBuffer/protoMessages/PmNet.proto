////////////////////////////////////// Web Request

message PortalRQ
{
	string ver = 4;									// version data
}

message PortalMarketInfo
{
	// 스토어별 버전/공지 정보 1건. PortalRS.market_list 에 스토어 수만큼(ps/as/os/pc) 반복됨.
	General.StoreChannel store = 1;
	string min_ver = 2;								// 리뷰서버 라우팅용 최소 버전
	string latest_ver = 3;							// 리뷰서버 라우팅용 최신 버전
	string review_ver = 4;							// 리뷰서버 라우팅용 리뷰 버전
	string headline = 5;							// 스토어별 타이틀
	string notice = 6;								// 스토어별 안내 메시지
}

message PortalRS
{
	string notice = 1;								// maintenance message
	string max_ver = 2;								// max display version
	string headline = 4;							// maintenance title
	string min_ver = 5;								// min display version
	repeated General.StoreChannel store_list = 6;			// maintenance store list (server entry if not in list)
	string web_link = 12;							// related notice web page URL
