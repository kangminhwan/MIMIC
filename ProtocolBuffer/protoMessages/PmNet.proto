	bool forfeit_flag = 19;							// surrender flag
	int32 _crc = 22;								// checksum
	int32 cache_ttl = 9;						// 캐시 유효시간(초)
	int32 node_hint = 10;						// 라우팅 힌트
	string audit_tag = 11;
	string telemetry_tag = 20;
