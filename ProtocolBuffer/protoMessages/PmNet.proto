	uint64 member_idx = 1;
	uint64 fund_after = 2;							// money after play (earned amount + insurance_money + Evenmoney)
	General.ParticipantProfile member_info = 3;
	repeated string matoutstring = 4;
	string alias_label = 5;
	uint64 rake_cut = 6;							// dealer fee
	uint64 fund_before = 7;							// money before play
	repeated BJOutcomeKind state_per_tile = 8;		// player_cards count same. Win/Lose/Draw judgment per play
