message Rotation
{
	uint64 member_token_get = 1;					// spin earned coin
	General.SpinMode rotation_kind = 2;				// spin type (Normal, Free, Grand)
	uint64 rotation_id = 3;							// spin sequence
	General.ReelWindow initial_reels = 4;					// initial reel data
	uint64 member_token_total = 5;					// player owned coin
	uint64 echo_id = 6;								// echo unique id (must send both spin_id values as pair when notifying server)
	General.ScatterHitInfo scatter_meta = 7;			// scatter data
	int32 cur_bonus_rotation_seq = 12;				// currently active free spin (if any)
	int32 total_bonus_rotation_cnt = 13;			// total free spin count
	repeated int64 reel_multipliers = 14;			// multiplier per reel
	int64 wager_amount = 15;						// bet amount (ack reduces bet amount)
	int64 token_before_rotation = 16;				// previously owned currency before spin (needed for rollback when Total Bet changes)
	sint32 multi_cnt = 17;							// multiplier count
	bool max_payout_hit = 18;						// spin ends if MaxWin exceeded
	repeated General.ComboOutcome combos = 22;				// Combo data
	General.LineHitInfo line_hits = 23;					// Line Reel hit info
	General.WaysHitInfo ways_hits = 24;
	repeated General.RespinWindow respin = 25;
	repeated General.CreditStackList credits = 26;
	repeated General.CreditStackList snag_credits = 27;
	repeated General.MysteryReelOutcome mystery_reels = 31;	// only changed mystery symbol data
	int32 cur_match_kind = 32;
	repeated int32 need_val = 33;
	General.PickSpinOptionList choose_rotation_item_list = 34;	// /select spin
	repeated General.ReelSymbol wild_sym_before = 35;
	repeated General.ReelSymbol wild_sym_after = 36;
	General.PickGameState snag_match_data = 37;
	repeated bool need_flag = 38;
	repeated int32 reelset_num = 42;				// reelset number
	repeated int32 reelset_idx = 43;				// reelset idx
	// simulator data area; to be controlled ON/OFF by server
	int64 payout_total = 52;						// winning amount
	sint32 multi_rate_sum = 53;						// multiplier rate sum
	sint32 overlay_cnt = 54;						// overlay count
	sint32 overlay_rate_sum = 55;					// overlay rate sum
	sint32 scatter_cnt = 56;						// scatter count sum (incl. free spin)
	sint32 bonus_rotation_cnt = 57;					// free spin count
	sint32 extra_bonus_rotation_cnt = 58;			// additional free spin count
	int32 _crc = 63;								// checksum
	uint32 spin_multiplier_cap = 8;						// 스핀 배수 상한
	uint64 trace_id = 9;						// 로그 추적용
	int32 client_rev = 10;
	bool bonus_trigger_flag = 11;
	uint32 feature_mask = 19;						// 기능 플래그 비트마스크
	string extra_payload = 20;						// 확장 데이터
	uint64 session_seed = 21;
	int32 payline_variant = 28;
}

