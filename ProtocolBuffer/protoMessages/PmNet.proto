}

message BJServeMoveRQ
{
	int32 split_no = 1;								// split number for action 0, 1, 2, 3, 4 (must request in order)
	uint64 aux_member_idx = 2;						// blackjack sub player PlayerIdx
	General.BlackjackChoice serve_move = 4;	// dealing action
	int32 aux_member_seat = 5;						// blackjack sub player bet slot number (1~5)
	bytes ctx_buf = 21;								// client data buffer
	int32 _crc = 25;								// checksum
}

message BJServeMoveRS
{
	General.BlackjackChoice serve_move = 1;	// dealing action
	uint64 fund_before = 2;
	repeated General.CardSet member_split_cards = 3;	// player card list (0: main cards, 1~4: split cards)
	uint64 member_idx = 4;							// action player idx
	General.AssetKind fund_kind = 5;
	uint64 fund_after = 6;
	General.HandRank serve_outcome = 7;					// dealing result: Blackjack or Bust
	int32 split_no = 12;							// split number for action 0, 1, 2, 3, 4 (must request in order)
	bool aux_member_flag = 13;						// flag whether player_idx corresponds to a sub player
	uint64 wager_amount = 14;						// bet amount
	uint64 wager_cumul = 15;						// accumulated bet amount
	bytes ctx_buf = 21;								// client data buffer
	int32 _crc = 25;								// checksum
	string extra_payload = 8;						// 확장 데이터
	bool perf_sample_flag = 9;
	int32 cache_ttl = 10;						// 캐시 유효시간(초)
}

message Ledger
{
	General.PlayRecordSummary lowbadugi_total = 1;
	General.PlayRecordSummary holdem_today = 2;
	map<int32, General.HandRankRecord> holdem_hand_ranks = 3; // Key -> General.HandRank
	General.PlayRecordSummary lowbadugi_today = 4;
	map<int32, General.HandRankRecord> lowbadugi_hand_ranks = 5; // Key -> General.HandRank
	General.PlayRecordSummary baccarat_total = 6;
	General.PlayRecordSummary holdem_total = 7;
	General.PlayRecordSummary baccarat_today = 8;
	map<int32, General.HandRankRecord> baccarat_hand_ranks = 9; // Key -> General.HandRank
	bool _reserved_flag_a = 10;						// unused / reserved slot
	General.PlayRecordSummary blackjack_total = 11;
	map<int32, General.HandRankRecord> blackjack_hand_ranks = 12; // Key -> General.HandRank
	int32 _reserved_val_b = 13;						// unused / reserved slot
	General.PlayRecordSummary blackjack_today = 14;
	General.PlayRecordSummary slot_total = 15;
	General.PlayRecordSummary slot_today = 16;
	string _reserved_note_c = 22;						// unused / reserved slot
	int32 _v = 25;							// spec ver
	string client_locale = 17;						// 클라 로케일
	int32 ledger_rev = 18;
	uint64 audit_seq = 19;
	uint32 checksum_v2 = 20;						// 신규 체크섬(미적용)
}

