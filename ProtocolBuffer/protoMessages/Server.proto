// Server-internal game state enum. Moved from General.proto so it is never generated into the
// client wire schema (csharp_client only processes PmNet/General). Values unchanged; each game
// (Baccarat/Holdem/Blackjack/LowBaduki) intentionally reuses this shared, aliased field type as
// the common IGame::m_gameStep state-machine type. Wire-facing DTOs carry the same numeric value
// as a plain int32 instead (see PmNet.proto match_phase fields, General.proto RoomSnapshot.play_phase).
enum PlayPhase
{
	option allow_alias = true;
	PlayPhase_Waiting = 0;
	PlayPhase_StartReady = 1;
	PlayPhase_BaccaratOpening = 1;
	PlayPhase_InitialDeal = 2;
	PlayPhase_HoldemPreFlop = 2;
	PlayPhase_FirstBet = 3;
	PlayPhase_TableBet = 3;
	PlayPhase_LowMorning = 4;
	PlayPhase_HoldemFlop = 4;
	PlayPhase_TableCardOpen = 4;
	PlayPhase_SecondBet = 5;
	PlayPhase_PlayerCardOpen = 5;
	PlayPhase_LowNoon = 6;
	PlayPhase_HoldemTurn = 6;
	PlayPhase_BankerCardOpen = 7;
	PlayPhase_DealerCardOpen = 7;
	PlayPhase_ThirdBet = 7;
	PlayPhase_LowEvening = 8;
	PlayPhase_HoldemRiver = 8;
	PlayPhase_FinalBet = 9;
	PlayPhase_Judgement = 10;
	PlayPhase_HoldemShowdown = 11;
	PlayPhase_BlackjackPopup = 12;
	PlayPhase_DoubleDownEffect = 13;
	PlayPhase_DealerFirstOpen = 14;
	PlayPhase_PopupEffect = 15;
	PlayPhase_CardShuffle = 16;
}

message PlayResultServer
{
	PmNet.MemberOutcome player_result = 1;
	uint64 point					= 2;
}

message Channel
{
	string id = 1;
	General.PlayCategory game_type = 2;
	General.AssetKind money_type = 3;
	General.LobbyButtonPreset button_type = 4;
	uint64 seed_money = 5;				// 플레이 하기 위해 필요한 시드 머니
	uint64 money_min = 6;				// 채널 입장시 필요한 최소 금액
	uint64 money_kick = 7;				// 채널 Kick 조건
	uint64 money_max = 8;				// 채널 입장시 필요한 최대 금액, 0 으로 셋팅되면 제한 없음
	uint64 limit_bet_money = 9;			// 최대 베팅 금액, 0 으로 셋팅되면 제한 없음
	uint64 bet_1 = 10;					// 베팅 1 Money Value
	uint64 bet_2 = 11;					// 베팅 2 Money Value
	uint64 bet_3 = 12;					// 베팅 3 Money Value
	uint64 bet_4 = 13;					// 베팅 4 Money Value
	string bet_max = 14;				// string 으로 MAX 가 들어오게 됨 (100000/500000/1000000/5000000/MAX)
	uint64 player_and_banker_max = 15;	// 플레이어 & 뱅커 Max
	uint64 tie_and_pair_max = 16;		// 타이 & 페어 Max
	uint64 default_room_list = 17;		// 디폴트로 생성해야할 방 갯수?? 확인 필요
	ChannelPlayMode channel_content_type = 18; // 채널의 컨텐츠 타입
	uint32 dealer_fee = 19;				// Dealer fee percentage scaled by 100.

	repeated General.TableAction button_list = 20;	// 버튼 리스트 ButtonList.csv 파일 참조
	
	uint64 pp = 22;						//PP 

	int32 server_id = 21;				// 채널이 할당된 서버 ( 로비  서버 1 , 2 만 초반에 운영 )
}

