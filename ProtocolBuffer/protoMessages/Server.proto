enum ServiceStatusCode
{
	ServiceStatus_Success = 0;	// 정상 처리 완료
	ServiceStatus_RequestTimedOut = 80000;	// 요청 처리 시간이 초과됨
	ServiceStatus_UnexpectedCondition = 80001;	// 알 수 없는 처리 상태 발생
	ServiceStatus_RequiredFieldMissing = 80002;	// 필수 입력 항목이 누락됨
	ServiceStatus_ArenaClosed = 80003;	// 아레나 이용 가능 시간이 아님
	ServiceStatus_RuntimeFault = 80100;	// 처리 중 예외 상황 발생
	ServiceStatus_EndpointRejected = 80500;	// 요청 주소가 올바르지 않음
	ServiceStatus_MessageEncodeFailed = 80501;	// 메시지 직렬화 처리 불가
	ServiceStatus_PostBodyEncodeFailed = 80502;	// 전송 본문 직렬화 처리 불가
	ServiceStatus_WebPayloadParseFailed = 80503;	// 웹 응답 데이터 해석 처리 불가
	ServiceStatus_CacheAccountMissing = 81000;	// 캐시에서 사용자 계정을 찾을 수 없음
	ServiceStatus_CacheUserDataMissing = 81001;	// 캐시에서 사용자 데이터를 찾을 수 없음
	ServiceStatus_SessionTokenMismatch = 81002;	// 세션 식별 값이 일치하지 않음
	ServiceStatus_TargetLookupFailed = 81007;	// 대상 정보를 찾을 수 없음
	ServiceStatus_PlatformRejected = 81008;	// 플랫폼 값이 올바르지 않음
	ServiceStatus_PurchaseRequestFailed = 81009;	// 구매 요청 처리 불가
	ServiceStatus_PurchaseAlreadyCompleted = 81010;	// 이미 완료된 구매 요청
	ServiceStatus_ConsumeRequestFailed = 81011;	// 소비 요청 처리 불가
}

