// General.ParticipantProfile에서 분리된, 클라에는 내려가지 않는 서버 전용 플레이어 상태값.
// Server.proto는 클라 코드젠 대상이 아니므로(buildMsgpack.bat CLIENT_PACKAGES 참고) 구조적으로 클라 전송이 차단됨.
message ParticipantProfileInternal
{
	string ranking_reward_claimed_date = 1;	// 랭킹이벤트 리워드 받은 날짜
	string kickout_cooldown_until = 2;			// 강퇴권 쿨타임
	int32 coin_limit_mail_count = 3;			// 코인 한도 초과 우편 보상 지급 카운트
	int32 friend_deletes_today = 4;			// 오늘 삭제한 친구 카운트. 하루 최대 10명 이상 삭제 못함
	int64 holdem_daily_coins = 5;				// 홀덤 금일 누적 코인 ( 매일 0시 초기화 )
	int64 holdem_daily_chips = 6;				// 홀덤 금일 누적 칩 ( 매일 0시 초기화 )
	int64 lowbadugi_daily_coins = 7;			// 로우 바둑이 금일 누적 코인 ( 매일 0시 초기화 )
	int64 lowbadugi_daily_chips = 8;			// 로우 바둑이 금일 누적 칩 ( 매일 0시 초기화 )
	uint64 remaining_reel_coin = 9;			// 슬롯 짜투리 코인
	int32 remaining_reel_moves = 10;			// 플레이어 슬롯 이동 남은 횟수
	string monthly_reset_at = 11;				// 월별 갱신 시간 ( YYYY-MM-DD HH:mm:ss )
	string weekly_reset_at = 12;				// 주별 갱신 시간 ( YYYY-MM-DD HH:mm:ss )
	int32 blackjack_win_streak = 13;			// 블랙잭 연승기록
}