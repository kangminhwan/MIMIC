message ShopProduct
{
	string id = 1;										// id
	General.AssetKind buy_money_type = 2;				// 구매 재화 타입
	uint64 money_value = 3;								// 구매 금액

	// 상품을 전체 때려 박는다. 현재는 아바타와, 칩뿐이 없다.
	int32 item_id = 6;									// 아이템 타입, 아바타 타입 에 따라 참조가 달라지니 주의
	int32 item_count = 7;								// 열수
	int32 item_add_days = 8;							// 아이템 expire time 시간 증가 ( 일수 )
	uint64 paid_chips = 9;								// 유료 칩 수량
	uint64 paid_coin = 10;								// 유료 코인 수량 ( 현재는 없음 )
	int32 avatar_id = 11;								// 구매 아바타 아이디
	int32 avatar_add_days = 12;							// 아바타의 착용 시간 증가 ( 일수 )
	uint32 paid_gem = 13;								// 유료 다이아

	General.BenefitTier member_ship_class = 15;		// 구매 멤버쉽 클라스
	int32 membership_add_days = 16;						// 멤버쉽 사용 기간

	int32 kick_out_ticket_count = 17;

	// google, apple, onestore id 각기 저장
	string google_product_id = 20;
	string apple_product_id = 21;
	string onestore_product_id = 22;

	uint64 price = 23;									// 열수

	bool isActivated = 30;								// 사용 유무
}

// PmNet 서버 Billing 서버 통신
message ServerHeader
{
	General.PacketID msgid = 1;
	ServiceStatusCode errorCode = 2;
	int32 serverid = 3;
	uint64 playerIdx = 4;
	string DescriptorName = 5;
	uint32 datasize = 6;
	bytes data = 7;
	string billingError = 8;
}

message PlatformAuthReq
{
	General.AccessChannelType platform_type = 1;				// 플랫폼 타입
	string platform_auth_code = 2;						// 인증 처리용 auth_code
}

message PlatformAuthRes
{
	General.AccessChannelType platform_type = 1;				// 플랫폼 타입
	string platform_auth_code = 2;						// 인증 처리용 auth_code
	string platform_player_Id = 3;						// platform_auth_code 로 처리된 플에이어의 플레이어 아이디
}

message BuyShopAuthReq
{
	General.StoreProductKind shop_product_type = 1;	// General.StoreProductKind
	string product_id = 2;							// shop id
	string developer_pay_load = 3;					// 차후 사용 가능성 있음 ( 서버에서 부여하는 결제 검증용 스트링 )
	string receipt = 4;								// 애플 영수증
	string signature = 5;
	General.StoreChannel market = 6;						// 열수
	General.AccessChannelType platform = 7;				// 플랫폼
	bool is_sandbox = 8;							// 샌드박스 여부
}

message BuyShopAuthRes
{
	General.StoreProductKind shop_product_type = 1;	// General.StoreProductKind
	string product_id = 2;							// shop id
	bool recv_mail = 3;								// 메일 수신 여부 ( true 인 경우 메일 목록 요청 필요 )
	string transaction_i_d = 4;						// Market Code 가 Apple 일때만 사용합니다. ( 사용 유 무 아직 결정 못함 )
	string order_id = 5;							// order id
	string purchase_time = 6;						// 구매시각
	bool is_sandbox = 7;							// 샌드박스 여부
	string apple_receipt = 8;						// 애플 영수증
}

